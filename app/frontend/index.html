<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinaryStamp — Prove file ownership on-chain</title>
    <meta name="description" content="Drop any file, get a cryptographic stamp. Immutable, verifiable, on-chain proof of ownership.">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="BinaryStamp">
    <meta property="og:description" content="Drop any file, get a cryptographic stamp. Immutable, verifiable, on-chain proof of ownership.">
    <meta property="og:url" content="https://binarystamp.com">
    <meta property="og:site_name" content="BinaryStamp">
    <meta property="og:image" content="https://binarystamp.com/og.png">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@binarystamp">
    <meta name="twitter:title" content="BinaryStamp">
    <meta name="twitter:description" content="Drop any file, get a cryptographic stamp. Immutable, verifiable, on-chain proof of ownership.">
    <meta name="twitter:image" content="https://binarystamp.com/og.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <div class="header-inner">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 32 32" width="28" height="28">
                        <rect x="2" y="2" width="28" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
                        <circle cx="16" cy="16" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
                        <line x1="10" y1="10" x2="22" y2="22" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <span class="logo-text">BinaryStamp</span>
                </div>
                <div class="wallet-area">
                    <button id="btn-connect" class="btn btn-outline">Connect Wallet</button>
                    <span id="wallet-address" class="wallet-address hidden"></span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <section class="view active">
                <div class="card">
                    <h2>Stamp or verify a file</h2>
                    <p class="subtitle">Drop a file to see whether it has been claimed &mdash; and claim it if not</p>

                    <div id="drop-zone" class="drop-zone">
                        <svg viewBox="0 0 48 48" width="48" height="48" class="drop-icon drop-icon-default">
                            <rect x="8" y="8" width="32" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
                            <line x1="24" y1="16" x2="24" y2="32" stroke="currentColor" stroke-width="2"/>
                            <line x1="16" y1="24" x2="32" y2="24" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <svg viewBox="0 0 48 48" width="48" height="48" class="drop-icon drop-icon-loading hidden">
                            <circle cx="24" cy="24" r="14" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="60 28" class="spinner"/>
                        </svg>
                        <span class="drop-text">Drop file here or click to select</span>
                        <span class="drop-status hidden"></span>
                        <input type="file" id="file-input" hidden>
                    </div>

                    <div class="form-group">
                        <label for="hash-input">Or paste a hash / ENS name</label>
                        <div class="input-row">
                            <input type="text" id="hash-input" placeholder="0x... or &lt;hash&gt;.binarystamp.eth">
                            <button id="btn-check" class="btn btn-primary">
                                <span class="btn-text">Check</span>
                                <span class="btn-loading hidden">
                                    <svg class="spinner" viewBox="0 0 20 20" width="16" height="16"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="30 14"/></svg>
                                </span>
                            </button>
                        </div>
                    </div>

                    <div id="hash-result" class="hash-result hidden">
                        <label>SHA-256</label>
                        <div class="hash-display">
                            <code id="file-hash"></code>
                            <button class="btn-icon" id="btn-copy" title="Copy">
                                <svg viewBox="0 0 20 20" width="16" height="16"><rect x="6" y="6" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="4" y="4" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
                            </button>
                        </div>
                        <div class="file-info">
                            <span id="file-name"></span>
                            <span id="file-size"></span>
                        </div>
                    </div>

                    <!-- Outcome of the lookup: stamped details, or nothing found -->
                    <div id="lookup-result" class="verify-result hidden"></div>

                    <!-- Shown only when the hash is not yet stamped -->
                    <div id="claim-panel" class="claim-panel hidden">
                        <div class="panel-header">
                            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="7" x2="10" y2="13" stroke="currentColor" stroke-width="1.5"/><line x1="7" y1="10" x2="13" y2="10" stroke="currentColor" stroke-width="1.5"/></svg>
                            <span>Claim this file</span>
                        </div>
                        <div class="form-group">
                            <label for="stamp-desc">Description (optional)</label>
                            <input type="text" id="stamp-desc" placeholder="What is this file?">
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="store-walrus" checked>
                                Store metadata on Walrus
                            </label>
                        </div>

                        <div class="chain-select">
                            <label>Register on:</label>
                            <div class="chain-options">
                                <button class="chain-btn active" data-chain="evm">
                                    <svg viewBox="0 0 20 20" width="16" height="16"><polygon points="10,2 18,10 10,18 2,10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
                                    Base (EVM)
                                </button>
                                <button class="chain-btn" data-chain="sui">
                                    <svg viewBox="0 0 20 20" width="16" height="16"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
                                    Sui
                                </button>
                                <button class="chain-btn" data-chain="both">Both</button>
                            </div>
                        </div>

                        <button id="btn-stamp" class="btn btn-primary btn-full">
                            <span class="btn-text">Register Stamp</span>
                            <span class="btn-loading hidden">
                                <svg class="spinner" viewBox="0 0 20 20" width="16" height="16"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="30 14"/></svg>
                                Processing...
                            </span>
                        </button>
                    </div>

                    <!-- Outlives the claim form, so the transaction stays visible -->
                    <div id="stamp-result" class="stamp-result hidden"></div>

                    <!-- Shown only when the stamp exists and we can sign for its chain -->
                    <div id="transfer-panel" class="transfer-panel hidden">
                        <div class="panel-header">
                            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><line x1="3" y1="10" x2="15" y2="10" stroke="currentColor" stroke-width="1.5"/><polyline points="11,6 15,10 11,14" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
                            <span>Transfer ownership</span>
                            <span id="transfer-chain" class="chain-badge"></span>
                        </div>
                        <p class="subtitle">Sign with the wallet that currently owns this stamp.</p>
                        <div class="form-group">
                            <label for="transfer-to">New owner address</label>
                            <div class="input-row">
                                <input type="text" id="transfer-to" placeholder="0x...">
                                <button id="btn-transfer" class="btn btn-primary">
                                    <span class="btn-text">Transfer</span>
                                    <span class="btn-loading hidden">
                                        <svg class="spinner" viewBox="0 0 20 20" width="16" height="16"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="30 14"/></svg>
                                    </span>
                                </button>
                            </div>
                        </div>
                        <div id="transfer-result" class="verify-result hidden"></div>
                    </div>

                    <!-- Provenance questions, only useful once a stamp exists -->
                    <div id="ai-panel" class="ai-panel hidden">
                        <div class="form-group">
                            <div class="input-row">
                                <input type="text" id="ai-question" placeholder="Ask about this file's history...">
                                <button id="btn-ai-ask" class="btn btn-outline">
                                    <span class="btn-text">Ask</span>
                                    <span class="btn-loading hidden">
                                        <svg class="spinner" viewBox="0 0 20 20" width="16" height="16"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="30 14"/></svg>
                                    </span>
                                </button>
                            </div>
                        </div>
                        <div id="ai-answer" class="ai-answer hidden"></div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer>
            <div class="footer-inner">
                <div class="footer-left">
                    <span>BinaryStamp</span>
                    <a href="https://x.com/binarystamp" target="_blank" rel="noopener" class="footer-social" title="Follow on X">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    </a>
                    <a href="https://github.com/binarystamp" target="_blank" rel="noopener" class="footer-social" title="GitHub">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
                    </a>
                </div>
                <div class="footer-links">
                    <span class="chain-badge" id="badge-evm">Base Sepolia</span>
                    <span class="chain-badge" id="badge-sui">Sui Testnet</span>
                    <span class="chain-badge" id="badge-ens">ENS</span>
                    <span class="chain-badge" id="badge-graph">The Graph</span>
                    <span class="chain-badge" id="badge-walrus">Walrus</span>
                </div>
            </div>
        </footer>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
