version: "3.8"

services:
  binarystamp:
    build: ./app
    ports:
      - "8082:8082"
    env_file:
      - .env
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
