name: Deploy Sui Move Contract

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Sui CLI
        run: |
          curl -fsSL -o sui.tgz "https://github.com/MystenLabs/sui/releases/download/testnet-v1.76.0/sui-testnet-v1.76.0-ubuntu-x86_64.tgz"
          tar xzf sui.tgz
          chmod +x sui
          sudo mv sui /usr/local/bin/
          sui --version

      - name: Configure Sui Client
        run: |
          mkdir -p ~/.sui/sui_config

          cat > ~/.sui/sui_config/sui.keystore <<'EOF'
          []
          EOF

          cat > ~/.sui/sui_config/client.yaml <<'EOF'
          ---
          keystore:
            File: /home/runner/.sui/sui_config/sui.keystore
          envs:
            - alias: testnet
              rpc: "https://fullnode.testnet.sui.io:443"
          active_env: testnet
          active_address: ~
          EOF

          sui keytool import "${{ secrets.SUI_PRIVATE_KEY_TESTNET }}" ed25519
          echo "Imported key"
          sui client envs
          sui client active-address

      - name: Build Move Package
        run: |
          cd sui-package
          sui move build 2>&1

      - name: Publish to Sui Testnet
        run: |
          cd sui-package
          sui client publish --gas-budget 200000000 --json 2>&1 | tee /tmp/publish-result.json

          PACKAGE_ID=$(cat /tmp/publish-result.json | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for obj in data.get('objectChanges', []):
              if obj.get('type') == 'published':
                  print(obj['packageId'])
                  break
          " 2>/dev/null || echo "PARSE_FAILED")

          echo "## Sui Package Deployed" >> $GITHUB_STEP_SUMMARY
          echo "Package ID: \`$PACKAGE_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "PACKAGE_ID=$PACKAGE_ID"

      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sui-publish-result
          path: /tmp/publish-result.json
