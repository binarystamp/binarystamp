<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="BinaryStamp — Prove file ownership on-chain">
  <title>BinaryStamp</title>

  <rect width="640" height="360" fill="#ffffff"/>

  <!-- Registration marks: the corner ticks a printing plate is aligned by. -->
  <g stroke="#dcdcdc" stroke-width="1" fill="none">
    <path d="M22 22h13M22 22v13"/>
    <path d="M618 22h-13M618 22v13"/>
    <path d="M22 338h13M22 338v-13"/>
    <path d="M618 338h-13M618 338v-13"/>
  </g>

  <!-- The impression: concentric rings radiating from the mark. -->
  <g fill="none" stroke="#efefef">
    <circle cx="320" cy="126" r="56"/>
    <circle cx="320" cy="126" r="76"/>
  </g>
  <circle cx="320" cy="126" r="96" fill="none" stroke="#f6f6f6"/>

  <!-- Logo mark -->
  <g fill="none" stroke="#000000" stroke-width="3">
    <rect x="290" y="96" width="60" height="60" rx="9"/>
    <circle cx="320" cy="126" r="13"/>
    <line x1="307" y1="113" x2="333" y2="139"/>
  </g>

  <text x="320" y="230" text-anchor="middle"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="42" font-weight="600" letter-spacing="-1.4" fill="#000000">BinaryStamp</text>

  <text x="320" y="258" text-anchor="middle"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="14" letter-spacing="0.2" fill="#666666">Prove file ownership on-chain</text>

  <!-- sha256("BinaryStamp") — the product demonstrated on itself. -->
  <text x="320" y="296" text-anchor="middle"
        font-family="'Roboto Mono', 'SF Mono', 'Fira Code', Consolas, monospace"
        font-size="9" letter-spacing="0.6" fill="#d4d4d4">bae5c9fe04c70696e7a27dbb6e6319110a33eb6e4221085d9ee06b1fea59dc0e</text>

  <text x="320" y="328" text-anchor="middle"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="9" font-weight="500" letter-spacing="2.6" fill="#a0a0a0">BASE · SUI · ENS · WALRUS · THE GRAPH</text>
</svg>
